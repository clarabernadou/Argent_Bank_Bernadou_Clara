name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Serve the app from the repository sub-path (build only, source files untouched)
        run: |
          sed -i 's|<BrowserRouter>|<BrowserRouter basename={process.env.PUBLIC_URL}>|' src/App.js
          sed -i 's|href="/" onClick={logout}|href={process.env.PUBLIC_URL + "/"} onClick={logout}|' src/components/mainNav.jsx
      - run: npm run build
        env:
          CI: false
          PUBLIC_URL: /Argent_Bank_Bernadou_Clara
      - name: Add the simulated API
        run: |
          cp ../demo/demo-api.js build/
          sed -i 's|</head>|<script src="/Argent_Bank_Bernadou_Clara/demo-api.js"></script></head>|' build/index.html
          cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
